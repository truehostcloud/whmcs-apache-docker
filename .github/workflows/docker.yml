name: docker-build-push

on:
  push:
    branches:
      - main
      - upgrade/whmcs-8.13.7
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get the version
        id: vars
        run: |
          tag=$(printf '%.2f\n' "$(echo "scale=2; $GITHUB_RUN_NUMBER * .01" | bc -l)")
          previous=$(printf '%.2f\n' "$(echo "scale=2; ($GITHUB_RUN_NUMBER - 1) * .01" | bc -l)")
          echo "tag=$tag" >> $GITHUB_OUTPUT
          echo "previous=$previous" >> $GITHUB_OUTPUT

          ref="${GITHUB_REF#refs/heads/}"
          if [ "$ref" = "main" ]; then
            suffix="prod"
          else
            suffix="upgrade"
          fi
          echo "suffix=$suffix" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: truehostcloud/whmcs-apache-docker:${{ steps.vars.outputs.tag }}-${{ steps.vars.outputs.suffix }}
          cache-from: type=registry,ref=truehostcloud/whmcs-apache-docker:latest-${{ steps.vars.outputs.suffix }}-buildcache
          cache-to: type=registry,ref=truehostcloud/whmcs-apache-docker:latest-${{ steps.vars.outputs.suffix }}-buildcache,mode=max